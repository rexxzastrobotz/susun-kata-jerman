
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch Quiz</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #101010;
  --card: #191919;
  --border: #303030;
  --white: #ffffff;
  --gray: #999999;
  --soft: #252525;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 900px;
  animation: fadeUp .7s ease;
}

.header {
  text-align: center;
  margin-bottom: 35px;
}

.logo {
  width: 75px;
  height: 75px;
  border-radius: 22px;
  background: white;
  color: #111;
  display: grid;
  place-items: center;
  font-size: 35px;
  font-weight: bold;
  margin: 0 auto 18px;
  animation: float 3s ease-in-out infinite;
}

h1 {
  font-size: 36px;
  letter-spacing: -1.5px;
}

.subtitle {
  color: var(--gray);
  font-size: 16px;
  margin-top: 10px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 40px;
  min-height: 490px;
  transition: .3s;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 28px;
}

.stat {
  background: #222;
  padding: 18px;
  border-radius: 15px;
  color: var(--gray);
  font-size: 13px;
  text-align: center;
  letter-spacing: 1px;
}

.stat strong {
  display: block;
  color: white;
  font-size: 25px;
  margin-top: 9px;
}

.progress {
  height: 8px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 35px;
}

.bar {
  height: 100%;
  width: 0%;
  background: white;
  transition: width .5s ease;
}

.tag {
  color: #aaa;
  font-size: 13px;
  letter-spacing: 2px;
  font-weight: bold;
}

.question {
  font-size: 34px;
  margin: 18px 0 12px;
  line-height: 1.4;
}

.desc {
  font-size: 16px;
  color: var(--gray);
  margin-bottom: 30px;
  line-height: 1.6;
}

.answer {
  min-height: 90px;
  background: #111;
  border: 1px dashed #444;
  border-radius: 16px;
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 30px;
  transition: .3s;
}

.answer.empty:after {
  content: "Pilih kata untuk menyusun kalimat...";
  color: #666;
  font-size: 15px;
}

.words {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
}

.word {
  background: #303030;
  color: white;
  border: 1px solid #484848;
  padding: 17px 24px;
  border-radius: 12px;
  font-size: 17px;
  cursor: pointer;
  transition: all .25s ease;
  animation: popIn .4s backwards;
  user-select: none;
}

.word:hover {
  background: white;
  color: #111;
  transform: translateY(-5px);
}

.word:active {
  transform: scale(.92);
}

.word.used {
  opacity: 0;
  transform: scale(.7);
  pointer-events: none;
}

.answer .word {
  background: white;
  color: #111;
  border: 0;
  cursor: default;
  animation: popIn .25s ease;
}

.feedback {
  margin-top: 25px;
  min-height: 25px;
  font-size: 16px;
  font-weight: bold;
}

.correct {
  color: white;
}

.wrong {
  color: #aaa;
}

.footer {
  text-align: center;
  margin-top: 28px;
  color: #666;
  font-size: 13px;
  letter-spacing: 2px;
}

.result {
  text-align: center;
  padding: 50px 10px;
  animation: zoomIn .6s ease;
}

.result h2 {
  font-size: 38px;
  margin: 25px 0 15px;
}

.result p {
  color: #aaa;
  line-height: 1.8;
  font-size: 16px;
}

.final-score {
  font-size: 65px;
  font-weight: bold;
  margin: 30px 0;
}

.primary {
  background: white;
  color: #111;
  border: 0;
  padding: 17px 35px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
}

.primary:hover {
  background: #bbb;
  transform: scale(1.05);
}

.fade-change {
  animation: fadeUp .45s ease;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(.8) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes zoomIn {
  from {
    opacity: 0;
    transform: scale(.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* TABLET */

@media (min-width: 600px) and (max-width: 1024px) {
  body {
    padding: 35px;
  }

  .container {
    max-width: 850px;
  }

  .card {
    padding: 35px;
  }

  .question {
    font-size: 32px;
  }

  .word {
    font-size: 18px;
    padding: 19px 25px;
  }

  .answer {
    min-height: 100px;
  }
}

/* DESKTOP */

@media (min-width: 1025px) {
  body {
    padding: 50px;
  }

  .container {
    max-width: 950px;
  }

  .card {
    padding: 45px;
    min-height: 550px;
  }

  .question {
    font-size: 38px;
  }

  .word {
    font-size: 19px;
    padding: 20px 29px;
  }

  .answer {
    min-height: 110px;
  }
}

/* MOBILE */

@media (max-width: 599px) {
  body {
    padding: 17px;
  }

  .header {
    margin-bottom: 22px;
  }

  .logo {
    width: 55px;
    height: 55px;
    font-size: 27px;
  }

  h1 {
    font-size: 27px;
  }

  .card {
    padding: 20px;
    min-height: 400px;
    border-radius: 18px;
  }

  .stats {
    gap: 7px;
  }

  .stat {
    padding: 13px 5px;
    font-size: 10px;
  }

  .stat strong {
    font-size: 19px;
  }

  .question {
    font-size: 25px;
  }

  .desc {
    font-size: 13px;
  }

  .word {
    padding: 13px 16px;
    font-size: 14px;
  }

  .answer {
    min-height: 70px;
    padding: 12px;
    gap: 8px;
  }

  .answer .word {
    padding: 11px 13px;
  }

  .footer {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="logo">D</div>
    <h1>Deutsch Quiz</h1>
    <p class="subtitle">German Word Challenge</p>
  </header>

  <main class="card" id="game">

    <div class="stats">
      <div class="stat">
        SOAL
        <strong id="number">1/10</strong>
      </div>

      <div class="stat">
        SKOR
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        WAKTU
        <strong id="timer">60s</strong>
      </div>
    </div>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <span class="tag" id="level">LEVEL 1</span>

    <h2 class="question" id="question"></h2>

    <p class="desc">
      Susun kata berikut menjadi kalimat Bahasa Jerman yang benar.
    </p>

    <div class="answer empty" id="answer"></div>

    <div class="words" id="words"></div>

    <div class="feedback" id="feedback"></div>

  </main>

  <div class="footer">
    DEUTSCH QUIZ • LEARN GERMAN
  </div>

</div>

<script>

const questions = [

 {
  q: "Saya pergi ke sekolah setiap pagi",
  a: ["Ich","gehe","jeden","Morgen","zur","Schule"]
 },

 {
  q: "Ibu saya memasak makanan di dapur",
  a: ["Meine","Mutter","kocht","das","Essen","in","der","Küche"]
 },

 {
  q: "Saya belajar bahasa Jerman bersama teman",
  a: ["Ich","lerne","Deutsch","zusammen","mit","meinen","Freunden"]
 },

 {
  q: "Adik laki-laki saya bermain sepak bola",
  a: ["Mein","kleiner","Bruder","spielt","gerne","Fußball"]
 },

 {
  q: "Kami pergi ke taman pada hari Minggu",
  a: ["Wir","gehen","am","Sonntag","in","den","Park"]
 },

 {
  q: "Ayah saya bekerja di sebuah perusahaan besar",
  a: ["Mein","Vater","arbeitet","in","einer","großen","Firma"]
 },

 {
  q: "Saya suka membaca buku di malam hari",
  a: ["Ich","lese","gerne","Bücher","am","Abend"]
 },

 {
  q: "Teman saya tinggal di sebuah kota kecil",
  a: ["Mein","Freund","wohnt","in","einer","kleinen","Stadt"]
 },

 {
  q: "Kami makan bersama keluarga setiap malam",
  a: ["Wir","essen","jeden","Abend","zusammen","mit","der","Familie"]
 },

 {
  q: "Saya ingin belajar bahasa Jerman setiap hari",
  a: ["Ich","möchte","jeden","Tag","Deutsch","lernen"]
 }

];

let current = 0;
let score = 0;
let selected = [];
let locked = false;
let seconds = 60;
let timerInterval;

const $ = id => document.getElementById(id);

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - .5);
}

function render() {

  const q = questions[current];

  selected = [];
  locked = false;

  $("number").textContent =
    `${current + 1}/${questions.length}`;

  $("score").textContent = score;

  $("level").textContent =
    `LEVEL ${Math.floor(current / 3) + 1}`;

  $("question").textContent = q.q;

  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  $("bar").style.width =
    (current / questions.length * 100) + "%";

  $("answer").innerHTML = "";
  $("answer").classList.add("empty");

  $("words").innerHTML = "";

  shuffle(q.a).forEach((word, index) => {

    const btn = document.createElement("button");

    btn.className = "word";
    btn.textContent = word;
    btn.style.animationDelay = (index * .06) + "s";

    btn.onclick = () => selectWord(word, btn);

    $("words").appendChild(btn);

  });

}

function selectWord(word, btn) {

  if (locked || btn.classList.contains("used")) return;

  btn.classList.add("used");

  selected.push(word);

  $("answer").classList.remove("empty");

  const item = document.createElement("button");

  item.className = "word";
  item.textContent = word;

  $("answer").appendChild(item);

  if (selected.length === questions[current].a.length) {

    locked = true;

    setTimeout(checkAnswer, 350);

  }

}

function checkAnswer() {

  const correct = questions[current].a;

  const isCorrect =
    selected.join(" ") === correct.join(" ");

  if (isCorrect) {

    score += 10;

    $("feedback").textContent =
      "✓ Richtig! Sehr gut!";

    $("feedback").className =
      "feedback correct";

  } else {

    $("feedback").textContent =
      "✕ Falsch! Jawaban: " + correct.join(" ");

    $("feedback").className =
      "feedback wrong";

  }

  $("score").textContent = score;

  setTimeout(nextQuestion, 1200);

}

function nextQuestion() {

  current++;

  if (current >= questions.length) {
    finishGame();
    return;
  }

  const card = $("game");

  card.classList.remove("fade-change");

  void card.offsetWidth;

  card.classList.add("fade-change");

  render();

}

function finishGame() {

  clearInterval(timerInterval);

  $("bar").style.width = "100%";

  $("game").innerHTML = `

    <div class="result">

      <div class="logo">D</div>

      <h2>Quiz Selesai!</h2>

      <p>Du hast es geschafft!</p>

      <div class="final-score">
        ${score}/100
      </div>

      <p>
        ${
          score >= 80
          ? "Ausgezeichnet! Kerja bagus!"
          : score >= 50
          ? "Sehr gut! Terus belajar!"
          : "Jangan menyerah! Coba lagi!"
        }
      </p>

      <br><br>

      <button class="primary"
        onclick="location.reload()">
        Main Lagi
      </button>

    </div>

  `;

}

function startTimer() {

  timerInterval = setInterval(() => {

    seconds--;

    $("timer").textContent = seconds + "s";

    if (seconds <= 0) {

      clearInterval(timerInterval);

      finishGame();

    }

  }, 1000);

}

render();
startTimer();

</script>

</body>
</html>
